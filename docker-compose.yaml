services:
  opus-web:
    container_name: opus-web
    image: opus-web:latest
    restart: unless-stopped
    build:
      context: .
    ports:
      - "3000:3000"
    environment:
      UPDATE_DB: "${UPDATE_DB:-0}"
      OPUS_EMAIL_SERVER: "${OPUS_EMAIL_SERVER:-}"
      OPUS_EMAIL_USER: "${OPUS_EMAIL_USER:-}"
      OPUS_EMAIL_PASSWORD: "${OPUS_EMAIL_PASSWORD:-}"
      OPUS_EMAIL_RECEIVER: "${OPUS_EMAIL_RECEIVER:-}"
      OPUS_EMAIL_PORT: "${OPUS_EMAIL_PORT:-587}"
      OPUS_EMAIL_SECURE: "${OPUS_EMAIL_SECURE:-false}"
      OPUS_EMAIL_TLS_REJECT_UNAUTHORIZED: "${OPUS_EMAIL_TLS_REJECT_UNAUTHORIZED:-true}"
      OPUS_HCAPTCHA_SECRET: "${OPUS_HCAPTCHA_SECRET:-}"
      LETSENCRYPT_EMAIL: "${LETSENCRYPT_EMAIL:-}"
    volumes:
      - ./data/opus:/data/opus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]

